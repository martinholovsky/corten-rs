[package]
name = "corten-sandbox"
description = "Confines itself with Landlock, then runs a program: Corten's broker and layer 5 sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
corten-std = { path = "../corten-std" }
corten-sha256 = { path = "../corten-sha256" }

# Owner decision 11 (spec section 8): the landlock crate; Unicode-3.0 allowed.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
# unshare (user and network namespaces, F2), getuid, getgid.
rustix = { version = "1.1.5", default-features = false, features = ["std", "thread", "process"] }

[dev-dependencies]
corten-broker = { path = "../corten-broker" }
corten-std = { path = "../corten-std" }
ed25519-compact = { version = "2.6.0", default-features = false, features = ["std"] }

[lints]
workspace = true
