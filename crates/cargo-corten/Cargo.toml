[package]
name = "cargo-corten"
description = "Builds a Rust crate under the Corten security profile, with flags it supplies itself"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Only workspace crates on purpose: the checker is part of Corten's trusted
# base (spec section 2), so every crate added here widens what must be
# trusted. corten-sha256 is the SHA-256 that used to live in src/sha256.rs.
[dependencies]
corten-sha256 = { path = "../corten-sha256" }

[lints]
workspace = true
