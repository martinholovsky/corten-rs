[package]
name = "corten-std"
description = "Corten's capability-oriented prelude: DirCap, typed sinks, Secret, signed manifest, misuse-resistant crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Every dependency is part of Corten's trusted base (docs/tcb.md). Kept to
# crates that need no `unsafe` from us and pass deny.toml.
[dependencies]
# Cryptography and randomness (Phase 6, batch 5; spec section 8, question 13,
# owner decision 2026-11-01; review in docs/gates/phase-6.md). Default
# features off: no library-generated salts or nonces from another source.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ed25519-compact = { version = "2.6.0", default-features = false, features = ["std"] }
getrandom = "0.4.3"
region = "3.0.2"
# TLS for NetCap (question 13: rustls on aws-lc-rs, the OS root store only;
# question 18: operator-supplied CRLs). Measured in docs/gates/phase-6.md.
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std"] }
rustls-native-certs = "0.8.5"
# The prelude reads the clock for manifest expiry (spec section 8, question 19);
# application code still has no clock authority.
rustix = { version = "1.1.5", default-features = false, features = ["std", "time"] }
subtle = "2.6.1"
zeroize = "1.9.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Name resolution for NetCap (question 17): DoT and DoH to the opt-in public
# resolvers; the system configuration otherwise. DNSSEC validation is not
# enabled (question 17: measured before it is). Blocking wrapper on a
# current-thread tokio runtime. Linux only, like
# NetCap's sockets (and macOS's system-config reader would pull a second
# core-foundation).
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio", "tls-aws-lc-rs", "https-aws-lc-rs"] }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
rustix = { version = "1.1.5", features = ["event", "fs", "net", "process", "rand"] }

[dev-dependencies]
# Test certificates and CRLs for the TLS client (crate::net); passes deny.toml.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
# A TLS 1.2-only test server, to show the client refuses it. Dev-dependency
# features stay out of normal builds (resolver 3, edition 2024).
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }

[lints]
workspace = true
