[package]
name = "corten-std"
description = "Corten's capability-oriented prelude: DirCap, typed sinks, Secret, signed manifest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Every dependency is part of Corten's trusted base (docs/tcb.md). Kept to
# crates that need no `unsafe` from us and pass deny.toml.
[dependencies]
ed25519-compact = { version = "2.6.0", default-features = false, features = ["std"] }
region = "3.0.2"
subtle = "2.6.1"
zeroize = "1.9.1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process", "rand"] }

[lints]
workspace = true
