[package]
name = "corten-gateway"
description = "Corten's exchange gateway: phishing-resistant sign-in through an OpenID Connect provider, short-lived Corten tokens for programs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Owner decision 2026-11-14 (docs/gates/gateway-proposal.md, Q2 option C):
# the relying-party steps are written here, on a small dependency set, instead
# of openidconnect (which failed the Phase 5 review). Signature checks and
# SHA-256 use aws-lc-rs, already in the trusted base through rustls.
[dependencies]
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
corten-std = { path = "../corten-std" }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
ed25519-compact = { version = "2.6.0", default-features = false, features = ["std"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "io-util", "time", "macros", "sync"] }
url = "2.5.8"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }

[lints]
workspace = true
