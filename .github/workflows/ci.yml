name: ci

on:
  push:
    branches: [main]
    # Releases: every step runs, and no cache is restored (clean build).
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly, so a new advisory against the lockfile fails without a push.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Pushes to main, tags,
# the schedule and manual runs are never cancelled: each keys on its commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  check:
    name: fmt, clippy, doc
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      # Compiled dependencies. Only main (pushes and the schedule) writes the
      # cache; pull requests restore it read-only; tags never use it.
      # zizmor cache-poisoning is suppressed below: tag (release) runs skip this
      # step by its `if:`, so a release never restores or saves a cache, and only
      # main writes one (save-if). zizmor reads the trigger, not the condition.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning]
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: tests
    runs-on: ubuntu-24.04
    # Measured 2026-11-02: 26 minutes uncached (the corpus compiles aws-lc
    # once per worker).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The scope step needs the merge base with the target branch.
          fetch-depth: 0
      - name: Scope self-test
        run: bash scripts/ci-scope.sh --self-test
      # Pull requests whose every changed file is prose skip the heavy steps
      # below; the step prints why and the files it read. Everything else,
      # and every non-PR event, runs them all (scripts/ci-scope.sh).
      - name: Scope
        id: scope
        run: bash scripts/ci-scope.sh
      - run: rustup toolchain install
      # Compiled dependencies, including the corpus's per-worker target
      # directories. Only main writes; pull requests restore read-only; tags
      # build clean. Cargo's fingerprints decide freshness: no verdict is
      # cached.
      # zizmor cache-poisoning is suppressed below: tag (release) runs skip this
      # step by its `if:`, so a release never restores or saves a cache, and only
      # main writes one (save-if). zizmor reads the trigger, not the condition.
      # `key` hashes corten-corpus's source, which decides the layout of
      # corpus-work: rust-cache does not save after an exact key match ("Cache
      # up-to-date."), and its automatic key hashes only Cargo files and
      # toolchains, so a layout change otherwise never reaches the cache
      # (measured: runs 42422911164 to 42629047981 restored the old layout).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning]
        with:
          key: corpus-${{ hashFiles('crates/corten-corpus/src/**') }}
          workspaces: |
            . -> target
            crates/corten-lints -> target
          cache-directories: ${{ runner.temp }}/corpus-work
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        if: steps.scope.outputs.heavy == 'true'
        with:
          tool: cargo-nextest@0.9.150
      # The checker requires corten-driver (owner decision 10); every later
      # step finds it through CORTEN_DRIVER.
      - name: Build corten-driver
        if: steps.scope.outputs.heavy == 'true'
        run: |
          driver=$(bash scripts/build-driver.sh)
          printf 'CORTEN_DRIVER=%s\n' "$driver" >> "$GITHUB_ENV"
      # corten-sandbox refuses to start while a descriptor without close-on-exec
      # is open, and the runner leaks some into every step; the wrapper closes them.
      - run: bash scripts/close-leaked-fds.sh cargo nextest run --workspace --all-features --locked
        if: steps.scope.outputs.heavy == 'true'
      - run: cargo test --doc --workspace --locked
        if: steps.scope.outputs.heavy == 'true'
      - name: Ledger gate
        run: cargo run --locked -p corten-ledger -- check
      # Re-checks every applicability program against the pinned rustc, and
      # fails if the generated table or doc, or the ledger's
      # rust_applicability column, no longer matches the evidence, or if the
      # chart's SVG is not what the table generates.
      - name: Rust applicability evidence
        run: |
          bash scripts/applicability-check.sh > /dev/null
          python3 scripts/applicability-table.py
          git diff --exit-code -- audit/applicability/table.csv docs/rust-applicability.md
          python3 scripts/applicability-chart.py --check
      # The same for the comparison languages (audit/languages/): every
      # program is re-checked against its pinned compiler, in a container
      # with no network that only compiles, and the rows, docs and chart
      # must match what the evidence generates.
      - name: C, C++, Java and Go applicability evidence
        run: |
          gcc=docker.io/library/gcc@sha256:51d7ef77d4e5ca232d635ce4a2a3154f18f9ccd01542a14bc06794e853ffddb9
          jdk=docker.io/library/eclipse-temurin@sha256:83f4a7fc27df94dcc7b8de04d14cbbba8da14406f921e966969c3b09000aa507
          golang=docker.io/library/golang@sha256:01aa404fa56b604b6f48e90c1d6e2c79fe5cd78f9592f78d80303fbe171cdcc0
          for spec in "c $gcc" "cpp $gcc" "java $jdk" "go $golang"; do
            lang=${spec%% *}
            docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
              --read-only --tmpfs /tmp -v "$PWD":/src:ro -w /src "${spec#* }" \
              bash scripts/language-check.sh "$lang" > "$RUNNER_TEMP/$lang-verdicts.tsv"
            python3 scripts/language-table.py "$lang" "$RUNNER_TEMP/$lang-verdicts.tsv"
          done
          python3 scripts/language-docs.py --check
      # docs/rust-comparison.md is generated against the ledger at a baseline
      # commit, which the shallow checkout lacks: fetch exactly that commit.
      - name: Rust comparison is current
        run: |
          base=$(sed -n 's/^BASELINE = "\([0-9a-f]\{40\}\)".*/\1/p' scripts/applicability-comparison.py)
          test -n "$base"
          git fetch --no-tags --depth=1 origin "$base"
          python3 scripts/applicability-comparison.py
          git diff --exit-code -- docs/rust-comparison.md
      # docs/residual-cwes.md is what the ledger's strategy column generates
      # (corten-ledger check enforces the column itself).
      - name: Residual CWE map is current
        run: python3 scripts/residual-map.py --check
      - name: Compile-fail corpus
        if: steps.scope.outputs.heavy == 'true'
        run: |
          cargo build --locked -p cargo-corten
          bash scripts/close-leaked-fds.sh cargo run --locked -p corten-corpus -- --checker target/debug/cargo-corten --work-dir "$RUNNER_TEMP/corpus-work"
      - name: Hermetic build smoke test
        if: steps.scope.outputs.heavy == 'true'
        run: |
          cargo build --locked -p cargo-corten -p corten-sandbox
          bash scripts/close-leaked-fds.sh bash scripts/hermetic-smoke.sh target/debug
      # Layer 4: the repository's own action, on a fresh crate outside the workspace.
      - name: Action self-test fixture
        if: steps.scope.outputs.heavy == 'true'
        run: |
          cargo new --quiet --vcs none "$RUNNER_TEMP/fixture"
          cargo generate-lockfile --manifest-path "$RUNNER_TEMP/fixture/Cargo.toml"
      - name: Action self-test
        if: steps.scope.outputs.heavy == 'true'
        id: corten
        uses: ./
        with:
          command: build
          manifest-path: ${{ runner.temp }}/fixture/Cargo.toml
          out-dir: ${{ runner.temp }}/corten-out
      - name: Action self-test outputs
        if: steps.scope.outputs.heavy == 'true'
        env:
          SBOM: ${{ steps.corten.outputs.sbom }}
          PROVENANCE: ${{ steps.corten.outputs.provenance }}
        run: |
          grep -q '"purl":"pkg:cargo/fixture@0.1.0"' "$SBOM"
          grep -q '"sandboxed":true' "$PROVENANCE"

  lint-driver:
    # Corten's own lints as a rustc driver on the nightly pinned in
    # crates/corten-lints (spec section 8, question 10). The tests job builds
    # it too and runs the checker with it.
    name: lint driver (nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Install the pinned nightly
        working-directory: crates/corten-lints
        run: rustup toolchain install
      - name: fmt, clippy and UI tests
        working-directory: crates/corten-lints
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  supply-chain:
    name: cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.0
      # From the release's gitleaks_8.30.0_checksums.txt, fetched 2026-10-26.
      GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 .'
