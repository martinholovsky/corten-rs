name: release-driver

# Builds the prebuilt corten-driver for the three platforms the owner chose
# (2026-11-22): Linux x86_64 in an AlmaLinux 8 container (glibc 2.28, so it runs
# on RHEL 8 and Debian 10 era systems and later), macOS arm64 and macOS x86_64.
#
# A pull request that touches the driver or this file runs the builds only, so
# a change is shown to build before it is released. A manual run on main also
# creates a DRAFT release holding the binaries, SHA256SUMS and a GitHub build
# provenance attestation, and prints the lines for
# crates/cargo-corten/driver-pins.txt. The pins land in the next commit, which
# changes only that file; the maintainer signs the version tag on that commit
# and publishes the draft from it (AGENTS.md, releases).

on:
  pull_request:
    paths:
      - .github/workflows/release-driver.yml
      - crates/corten-lints/**
      - scripts/build-driver.sh
  workflow_dispatch:
    inputs:
      version:
        description: "The version tag the pins will be released under, for example v0.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-driver-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: driver (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # AlmaLinux 8, end of life 2029-05-31 (endoflife.date), pinned by digest.
    container: docker.io/library/almalinux@sha256:974135fa35c47f8406ae9f81e8479fe0c372bdd64244a48770848466ceb694ce
    env:
      # rustup-init 1.29.3 for x86_64-unknown-linux-gnu, from
      # static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init.sha256
      RUSTUP_INIT_SHA256: b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55
      RUSTUP_INIT_URL: https://static.rust-lang.org/rustup/archive/1.29.3/x86_64-unknown-linux-gnu/rustup-init
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Tools
        run: dnf install -y --setopt=install_weak_deps=False gcc git tar binutils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rustup, verified
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf --max-time 300 -o /tmp/rustup-init "$RUSTUP_INIT_URL"
          echo "$RUSTUP_INIT_SHA256  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build corten-driver
        run: |
          set -euo pipefail
          driver=$(bash scripts/build-driver.sh --release)
          mkdir -p dist
          cp "$driver" "dist/corten-driver-$TARGET"
          # Evidence for the glibc floor: the newest symbol version it needs.
          objdump -T "dist/corten-driver-$TARGET" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          sysroot=$(rustup run "$(sed -n 's/^channel = "\(.*\)"/\1/p' crates/corten-lints/rust-toolchain.toml)" rustc --print sysroot)
          LD_LIBRARY_PATH="$sysroot/lib" "dist/corten-driver-$TARGET" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corten-driver-x86_64-unknown-linux-gnu
          path: dist/corten-driver-x86_64-unknown-linux-gnu
          if-no-files-found: error
          retention-days: 7

  macos:
    name: driver (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-26-intel
            target: x86_64-apple-darwin
            arch: x86_64
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build corten-driver
        run: |
          set -euo pipefail
          # The runner's architecture must be the target's: no cross build.
          test "$(uname -m)" = "$ARCH"
          driver=$(bash scripts/build-driver.sh --release)
          mkdir -p dist
          cp "$driver" "dist/corten-driver-$TARGET"
          lipo -archs "dist/corten-driver-$TARGET"
          sysroot=$(rustup run "$(sed -n 's/^channel = "\(.*\)"/\1/p' crates/corten-lints/rust-toolchain.toml)" rustc --print sysroot)
          DYLD_LIBRARY_PATH="$sysroot/lib" "dist/corten-driver-$TARGET" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corten-driver-${{ matrix.target }}
          path: dist/corten-driver-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: draft release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release
      id-token: write # sign the attestation
      attestations: write # store the build provenance attestation
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the version
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like v1.2.3, got: $VERSION" >&2; exit 1; }
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "a release $VERSION already exists; releases are immutable" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: corten-driver-*
          path: dist
          merge-multiple: true
      - name: Checksums and pins
        run: |
          set -euo pipefail
          cd dist
          n=$(find . -maxdepth 1 -type f -name 'corten-driver-*' | wc -l)
          test "$n" -eq 3 || { echo "expected 3 binaries, got $n" >&2; exit 1; }
          sha256sum corten-driver-* > SHA256SUMS
          cat SHA256SUMS
          {
            echo "### Lines for crates/cargo-corten/driver-pins.txt"
            echo
            echo '```'
            sed -E 's/^([0-9a-f]{64})  corten-driver-(.*)$/\2 \1/' SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/corten-driver-*
      - name: Draft release
        run: |
          set -euo pipefail
          pins=$(sed -E 's/^([0-9a-f]{64})  corten-driver-(.*)$/\2 \1/' dist/SHA256SUMS)
          fence=$(printf '\140\140\140')
          notes=$(printf 'corten-driver built from %s.\n\nPins for crates/cargo-corten/driver-pins.txt:\n\n%s\n%s\n%s\n' "$GITHUB_SHA" "$fence" "$pins" "$fence")
          gh release create "$VERSION" --draft --target "$GITHUB_SHA" \
            --title "$VERSION" --notes "$notes" dist/corten-driver-* dist/SHA256SUMS
