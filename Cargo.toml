[workspace]
members = [
    "crates/cargo-corten",
    "crates/corten-broker",
    "crates/corten-corpus",
    "crates/corten-ledger",
    "crates/corten-runtime",
    "crates/corten-sandbox",
    "crates/corten-std",
]
resolver = "3"
# Built with a pinned nightly (rustc internals), outside the stable workspace.
exclude = ["crates/corten-lints"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Same as rust-toolchain.toml, so the toolchain CI runs is the MSRV it tests.
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/martinholovsky/corten-rs"
# Nothing is published until the crate names and the first release are decided.
publish = false

[workspace.lints.rust]
# Corten's own code needs no unsafe; the checker is part of the trusted base.
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
let_underscore_must_use = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
