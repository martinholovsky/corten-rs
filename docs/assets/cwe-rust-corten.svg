<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d">
  <title id="t">CWE weaknesses that can still be written: Rust, safe Rust, safe Rust + Corten</title>
  <desc id="d">Of MITRE CWE 4.20's 944 weaknesses: 785 can be written in Rust with unsafe allowed; 722 in safe Rust (63 need unsafe); 641 in safe Rust under Corten (81 eliminated, verified by compile-fail tests).</desc>
  <!-- Data: docs/rust-applicability.md (per-CWE review, 2026-10-27), counted
       by scripts/applicability-table.py. Scale: 760 px = 944 CWEs. -->
  <defs>
    <path id="shield" d="M50 6 L88 18 V48 C88 72 72 88 50 96 C28 88 12 72 12 48 V18 Z"/>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0A060"/>
      <stop offset="0.55" stop-color="#D2702A"/>
      <stop offset="1" stop-color="#A9481B"/>
    </linearGradient>
    <mask id="cut">
      <rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <path d="M68.4 31.6 A26 26 0 1 0 68.4 68.4" fill="none" stroke="#000" stroke-width="14"/>
    </mask>
  </defs>
  <rect width="1200" height="660" rx="24" fill="#1E1714"/>

  <svg x="64" y="52" width="64" height="64" viewBox="0 0 100 100" aria-hidden="true">
    <use href="#shield" fill="#B5541E"/>
    <use href="#shield" fill="#8B3A1A" transform="translate(50 51) scale(0.84) translate(-50 -51)"/>
    <use href="#shield" fill="#6E2A12" transform="translate(50 51) scale(0.68) translate(-50 -51)"/>
    <use href="#shield" fill="#3A160A" transform="translate(50 51) scale(0.52) translate(-50 -51)"/>
    <g transform="translate(35 34) scale(0.3)"><g mask="url(#cut)"><rect x="6" y="6" width="88" height="88" rx="6" fill="url(#plate)"/></g></g>
  </svg>
  <g font-family="Archivo">
    <text x="144" y="74" font-size="14" font-weight="500" letter-spacing="3" fill="#D2702A">CORTEN · CWE SURFACE</text>
    <text x="144" y="112" font-size="34" font-weight="800" fill="#F6EBDD">Weaknesses you can still write</text>
    <text x="144" y="142" font-size="17" font-weight="500" fill="#CDBFB4">Of MITRE's 944 CWEs: what Rust's compiler, then Corten, take off the table.</text>

    <line x1="72" y1="178" x2="1128" y2="178" stroke="#3A2E28" stroke-width="1"/>

    <!-- Row 1: Rust, unsafe allowed -->
    <text x="72" y="236" font-size="18" font-weight="500" fill="#E9DCCB">Rust, <tspan font-family="monospace" font-size="16">unsafe</tspan> allowed</text>
    <text x="832" y="236" font-size="13" font-weight="500" fill="#A89A90" text-anchor="end">944 CWEs</text>
    <rect x="72" y="248" width="760" height="34" rx="4" fill="#2E2420"><title>MITRE CWE 4.20: 944 weaknesses</title></rect>
    <rect x="72" y="248" width="632" height="34" rx="4" fill="#76787C"><title>Rust, unsafe allowed: 785 CWEs</title></rect>
    <text x="848" y="272" font-size="20" font-weight="800" fill="#F6EBDD">785</text>
    <text x="900" y="272" font-size="15" font-weight="500" fill="#A89A90">159 not writable in Rust</text>

    <!-- Row 2: safe Rust -->
    <text x="72" y="336" font-size="18" font-weight="500" fill="#E9DCCB">Safe Rust</text>
    <rect x="72" y="348" width="760" height="34" rx="4" fill="#2E2420"/>
    <rect x="72" y="348" width="581.3" height="34" rx="4" fill="#76787C"><title>Safe Rust: 722 CWEs</title></rect>
    <rect x="656.3" y="349" width="46.7" height="32" rx="4" fill="none" stroke="#9A9CA0" stroke-width="2" stroke-dasharray="4 3"><title>63 CWEs need unsafe</title></rect>
    <text x="848" y="372" font-size="20" font-weight="800" fill="#F6EBDD">722</text>
    <text x="900" y="372" font-size="15" font-weight="500" fill="#CDBFB4">−63 need <tspan font-family="monospace" font-size="14">unsafe</tspan></text>

    <!-- Row 3: safe Rust + Corten, highlighted -->
    <rect x="56" y="408" width="1088" height="96" rx="12" fill="#2B1F1A"/>
    <text x="72" y="440" font-size="18" font-weight="800" fill="#F6EBDD">Safe Rust + Corten</text>
    <rect x="72" y="452" width="760" height="34" rx="4" fill="#3A2C25"/>
    <rect x="72" y="452" width="516.1" height="34" rx="4" fill="#D2702A"><title>Safe Rust + Corten: 641 CWEs still writable</title></rect>
    <rect x="591.1" y="453" width="62.2" height="32" rx="4" fill="none" stroke="#D2702A" stroke-width="2" stroke-dasharray="4 3"><title>81 eliminated by Corten, each verified by a compile-fail test</title></rect>
    <text x="848" y="476" font-size="20" font-weight="800" fill="#F6EBDD">641</text>
    <text x="900" y="476" font-size="15" font-weight="500" fill="#E8873A">−81 eliminated, verified</text>

    <line x1="72" y1="548" x2="1128" y2="548" stroke="#3A2E28" stroke-width="1"/>
    <g font-size="13" font-weight="500" fill="#A89A90">
      <text x="72" y="574">Per-CWE review of MITRE CWE 4.20, 2026-10-27 (docs/rust-applicability.md). 367 answers rest on programs re-checked against rustc 1.99.1.</text>
      <text x="72" y="596">Not writable in Rust: 67 need a construct Rust lacks, 92 are not code (hardware, physical, process). Corten eliminations: verified by its</text>
      <text x="72" y="618">compile-fail corpus; 608 would remain if every claimed elimination held. Corten forbids unsafe, so the 63 above are gone under it too.</text>
    </g>
  </g>
</svg>
