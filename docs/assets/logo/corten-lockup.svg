       wordmark is "corten" in Archivo ExtraBold (SIL Open Font License),
       120 px, letter-spacing -3, baseline at (222, 140), converted to
       outlines so it renders the same where Archivo is not installed (an
       <img> cannot load fonts). #B5541E (the outer shield) reads on light
       and dark backgrounds alike. -->
