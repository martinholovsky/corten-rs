      <text x="72" y="924">Hatched: only through the escape hatch (Java: JNI, sun.misc; Go: unsafe, cgo; Python: ctypes). Dashed line: what MITRE's language tags would count.</text>
      <text x="72" y="946">The tags record where a weakness was documented, not what a language allows, so they over- and under-count (docs/language-comparison.md).</text>
