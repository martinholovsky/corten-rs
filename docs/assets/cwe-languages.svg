  <title id="t">CWE weaknesses that can be written: C, C++, Java, Go, Python, Rust, safe Rust, safe Rust + Corten</title>
  <desc id="d">Of MITRE CWE 4.20's 944 weaknesses, writable per the per-CWE audit: C 789 (MITRE's tags say 838); C++ 795 (MITRE's tags say 847); Java 831 (MITRE's tags say 841); Go 790 (MITRE's tags say 764); Python 802 (MITRE's tags say 778); Rust with unsafe allowed 787 (MITRE's tags say 763); safe Rust 729; safe Rust under Corten 635 (94 eliminations verified).</desc>
